name: Deploy release files
description: >
  Upload everything staged in ./release to the server over HTTPS (through
  Cloudflare) using the hidden, key-gated chunked uploader on the backend.
  This sidesteps the upstream IP filtering that breaks direct SSH to the origin,
  and chunking sidesteps Cloudflare's 100MB request-body cap.

inputs:
  base_url:
    description: Backend base URL (Cloudflare-fronted), e.g. https://backend.htoochoon.com
    required: true
  key:
    description: Long random release-upload key (matches RELEASE_UPLOAD_KEY on the server)
    required: true
  target:
    description: >
      Release channel/subfolder under /htoochoon-releases on the server.
      Builder CI must use `nightly`; beta and production are Founder-promoted.
    required: false
    default: nightly

runs:
  using: composite
  steps:
    # Chunked HTTPS upload from the Linux Android runner.
    - shell: bash
      env:
        BASE_URL: ${{ inputs.base_url }}
        KEY: ${{ inputs.key }}
        TARGET: ${{ inputs.target }}
      run: |
        set -u
        BASE="${BASE_URL%/}"
        TARGET="${TARGET:-latest}"
        if [ -z "$KEY" ]; then echo "::error::release-upload key is empty"; exit 1; fi
        shopt -s nullglob
        uploaded=""
        for f in release/*; do
          [ -f "$f" ] || continue
          name="$(basename "$f")"
          tmp="$(mktemp -d)"
          # 16MB chunks — small enough that nginx only needs ~20m on the upload
          # route (not 100m), and a dropped chunk re-sends little. Default alpha
          # suffixes (part.aa, part.ab, …) sort correctly on GNU and BSD split.
          split -b 16777216 "$f" "$tmp/part."
          i=0
          for part in "$tmp"/part.*; do
            # curl's own --retry does NOT cover a 520 (or any 5xx): without
            # --fail curl treats the error response as a successful transfer, so
            # it never retries and we'd bail on a transient Cloudflare origin
            # blip. Retry at the app level on any non-2xx.
            attempt=0
            while :; do
              attempt=$((attempt + 1))
              code="$(curl -sS -o /dev/null -w '%{http_code}' \
                --connect-timeout 30 --max-time 600 \
                --retry 6 --retry-delay 5 --retry-all-errors \
                -X PUT -H "x-release-key: $KEY" \
                -H 'Content-Type: application/octet-stream' \
                --data-binary @"$part" \
                "$BASE/god/release/part?name=$name&index=$i&target=$TARGET" || echo 000)"
              if [ "$code" = "200" ] || [ "$code" = "201" ]; then break; fi
              if [ "$attempt" -ge 5 ]; then
                echo "::error::Upload of $name part $i failed after $attempt tries (HTTP $code)"
                rm -rf "$tmp"; exit 1
              fi
              echo "  $name part $i HTTP $code — retry $attempt/5"
              sleep 10
            done
            i=$((i + 1))
          done
          cattempt=0
          while :; do
            cattempt=$((cattempt + 1))
            local_sz="$(wc -c < "$f" | tr -d ' ')"
            resp="$(curl -sS --connect-timeout 30 --max-time 120 \
              --retry 6 --retry-delay 5 --retry-all-errors \
              -X POST -H "x-release-key: $KEY" -H 'Content-Type: application/json' \
              --data "{\"name\":\"$name\",\"parts\":$i,\"size\":$local_sz,\"target\":\"$TARGET\"}" \
              "$BASE/god/release/commit" || echo '')"
            case "$resp" in
              *'"ok":true'*) echo "  $name → $resp"; break ;;
            esac
            # The commit assembles the file and THEN deletes the staged parts.
            # A Cloudflare 520 can eat the response even though the backend
            # already finished — so a retry hits "missing part 0" on a file that
            # is in fact already published. Before retrying, confirm via the
            # list endpoint whether it landed at the right size.
            listing="$(curl -sS --connect-timeout 30 --max-time 60 \
              --retry 4 --retry-delay 5 --retry-all-errors \
              -H "x-release-key: $KEY" "$BASE/god/release/list?target=$TARGET" || echo '')"
            if printf '%s' "$listing" | grep -q "\"name\":\"$name\",\"size\":$local_sz"; then
              echo "  $name already published ($local_sz bytes; commit response was lost)"
              break
            fi
            if [ "$cattempt" -ge 5 ]; then
              echo "::error::Commit failed for $name after $cattempt tries: $resp"
              rm -rf "$tmp"; exit 1
            fi
            echo "  $name commit retry $cattempt/5: $resp"
            sleep 10
          done
          rm -rf "$tmp"
          uploaded="$uploaded $name"
        done
        if [ -z "$uploaded" ]; then echo "::error::Nothing in ./release to upload"; exit 1; fi
        echo "Uploaded:$uploaded"
